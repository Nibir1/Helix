# .goreleaser.yml
# Purpose: GoReleaser configuration for cross-platform Helix binaries with
# curated, professional release notes.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: helix
    main: ./cmd/helix
    binary: helix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X helix/internal/config.HelixVersion={{.Version}}

archives:
  - id: default
    # v2 key: list of formats (replaces deprecated `format`).
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # v2 key: `formats` inside overrides (replaces deprecated `format`).
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - scripts/install.sh
      - scripts/install.ps1

# PROFESSIONAL RELEASE NOTES:
# The raw commit dump is disabled. Release bodies are curated by humans in
# docs/RELEASE_NOTES.md (updated before every tag) and embedded verbatim via
# the release header template.
changelog:
  disable: true

release:
  header: |
    {{ readFile "docs/RELEASE_NOTES.md" }}

# Supply-Chain Security:
# Generates SPDX SBOMs for all archives and cryptographically signs every
# artifact using Sigstore keyless signing (OIDC from GitHub Actions).
sboms:
  - artifacts: archive
    cmd: syft
    args: ["$artifact", "-o", "spdx-json=$document"]

signs:
  - cmd: cosign
    # Certificate file NAME (placed next to the artifact in dist/).
    certificate: '{{ .ArtifactName }}.pem'
    args:
      - sign-blob
      - '--yes'
      - '--output-certificate'
      - '{{ .Certificate }}'
      - '--output-signature'
      - '{{ .Signature }}'
      # v2 field: full path of the artifact being signed.
      - '{{ .ArtifactPath }}'
    artifacts: all
    output: true