# .goreleaser.yml
# Purpose: GoReleaser configuration for cross-platform Helix binaries with
# curated, professional release notes.
# Fix (release pipeline):
#   - signs: GoReleaser v2 removed the `.Artifact`, `.Certificate`, and
#     `.Signature` template fields. The certificate/signature templates now
#     derive from `${artifact}`, and the cosign args write to those exact
#     same paths using the `${certificate}` and `${signature}` env vars.
#   - archives: migrated deprecated `format` / `format_overrides.format`
#     to the v2 `formats` list keys.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: helix
    main: ./cmd/helix
    binary: helix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X helix/internal/config.HelixVersion={{.Version}}

archives:
  - id: default
    # v2 key: list of formats (replaces deprecated `format`).
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # v2 key: `formats` inside overrides (replaces deprecated `format`).
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - scripts/install.sh
      - scripts/install.ps1

# PROFESSIONAL RELEASE NOTES:
# The raw commit dump is disabled. Release bodies are curated by humans in
# docs/RELEASE_NOTES.md (updated before every tag) and embedded verbatim via
# the release header template.
changelog:
  disable: true

release:
  header: |
    {{ readFile "docs/RELEASE_NOTES.md" }}

# Supply-Chain Security:
# Generates SPDX SBOMs for all archives and cryptographically signs every
# artifact using Sigstore keyless signing (OIDC from GitHub Actions).
sboms:
  - artifacts: archive
    cmd: syft
    args: ["$artifact", "-o", "spdx-json=$document"]

signs:
  - cmd: cosign
    # v2 signing model: these templates define the OUTPUT file names that
    # cosign produces; the args below write to the exact same paths
    # using the ${artifact}, ${certificate}, and ${signature} env vars.
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'
    args:
      - sign-blob
      - '--yes'
      - '--output-certificate'
      - '${certificate}'
      - '--output-signature'
      - '${signature}'
      - '${artifact}'
    artifacts: all
    output: true