# .github/workflows/ci.yml
# Purpose: Continuous Integration pipeline for Helix.
# Enforces linting, testing, and cross-platform builds on every PR and push.
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Workflow files are the one thing CI cannot prove by running: a step that is
  # wrong for a platform fails only on that platform, and a step that is wrong
  # everywhere fails only once someone pushes. Both are cheap to catch here.
  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install actionlint
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12; then
              exit 0
            fi
            echo "::warning::actionlint install failed (attempt $attempt/3) — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::actionlint could not be installed after 3 attempts"
          exit 1

      # actionlint AND a check it does not perform — see the script for why one
      # is not enough.
      - name: Check workflows
        shell: bash
        run: ./scripts/check-workflows.sh

  build-and-test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS report its own result instead of cancelling siblings.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.27, not 1.26, because of the fuzzing harness — see the note on the
        # "Run Fuzzing Smoke Test" step below. The language version the code is
        # written against is still go.mod's; this is the toolchain that runs it.
        go-version: ['1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download Dependencies
        run: go mod download

      # **The linter version and the Go version are ONE decision.** golangci-lint
      # embeds a type-checker built against a specific Go release and cannot read
      # export data from a newer one. This has now bitten twice, identically:
      # v1.59.1 could not read Go 1.25 ("undefined: beep / isatty / runewidth"),
      # and v2.5.0 could not read Go 1.27 —
      #
      #   could not load export data: internal error in importing
      #   "internal/byteorder" (cannot decode ..., export data version 4 is
      #   greater than maximum supported version 2)
      #
      # — on all three OSes, before a line of Helix was type-checked. The tell is
      # that the errors name the STANDARD LIBRARY inside the toolchain cache, not
      # this repository, and Windows reported "0 issues" while exiting 1.
      #
      # So: v2.13.2 is built with go1.27.0 and is the pin that matches the
      # go-version above. Moving one without the other is the failure, not the
      # fix. `go install` works identically on bash and PowerShell runners.
      # Retried, because this step's failures are not this project's failures.
      # A build of golangci-lint pulls ~200 modules from proxy.golang.org, and a
      # single HTTP/2 stream error there ("INTERNAL_ERROR; received from peer")
      # fails the whole job before a line of Helix is compiled. Retrying a
      # DOWNLOAD is not the same as retrying a red test: nothing about the
      # repository changes between attempts, so a pass on the second try is
      # evidence about the network rather than about the code.
      #
      # `shell: bash` is REQUIRED, not stylistic. This job's matrix includes
      # windows-latest, where the default shell is PowerShell — and pwsh cannot
      # parse `for x in 1 2 3; do`, so the first version of this retry failed
      # every Windows run with "Missing opening '(' after keyword 'for'". The
      # single-line `go install` it replaced worked in both shells by accident
      # of being one command; a loop has to say which shell it is written for.
      - name: Install golangci-lint (matched to the Go version above)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2; then
              exit 0
            fi
            echo "::warning::golangci-lint install failed (attempt $attempt/3) — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::golangci-lint could not be installed after 3 attempts"
          exit 1

      # Direct tool invocations (instead of make) keep the pipeline identical
      # on PowerShell, bash, and zsh runners (no chmod/Make dependency).
      - name: Run Linter
        run: golangci-lint run ./... --timeout=5m

      - name: Run Tests
        run: go test ./... -count=1
      
      # Needs Go >= 1.27. On 1.26 this step fails intermittently with a bare
      # "context deadline exceeded" and no failing input written to testdata —
      # which is the tell, because a genuine fuzz failure always writes the
      # crasher and prints a reproducer. It is a race in the fuzzing coordinator
      # itself: when -fuzztime expires there is a window where the parent
      # context is done but the worker context is not yet cancelled, so a
      # worker's deadline error escapes the suppression that exists for exactly
      # this and is reported as a test failure. Fixed upstream in 1.27
      # (go.dev/issue/75804); the suppression there now also compares against
      # the parent's ctx.Err().
      #
      # Do NOT "fix" a recurrence by retrying this step. A retry is the absence
      # of a diagnosis. The previous red fuzz run WAS a real bug — a blocked
      # worker in the sandbox path — so "it is probably the toolchain" is a
      # conclusion to reach after looking, not before. The tell that separates
      # them is above: a real crasher is written to testdata and printed as a
      # reproducer, and a harness race is not.
      - name: Run Fuzzing Smoke Test
        run: make fuzz-ci
        
      - name: Build Binary (CGO-free)
        run: go build -o dist/helix ./cmd/helix
        env:
          CGO_ENABLED: '0'
  
  # Run the e2e harness on all three OSes. The PTY/`!windows` tests skip
  # gracefully on Windows (build tag); the daemon-remote IPC test exercises
  # the loopback-TCP transport there. Direct `go test` avoids a Make
  # dependency on PowerShell runners.
  e2e:
    name: E2E Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download Dependencies
        run: go mod download

      - name: Run E2E Harness
        run: go test ./tests/e2e/... -count=1 -timeout 300s