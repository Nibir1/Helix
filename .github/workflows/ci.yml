# .github/workflows/ci.yml
# Purpose: Continuous Integration pipeline for Helix.
# Enforces linting, testing, and cross-platform builds on every PR and push.
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS report its own result instead of cancelling siblings.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download Dependencies
        run: go mod download

      # ROOT-CAUSE FIX: golangci-lint v1.59.1 predates Go 1.25 and cannot read
      # its type information, which produced bogus
      # "undefined: beep / isatty / runewidth (typecheck)" errors even with all
      # modules downloaded. The v2 release line is the first with full Go 1.25+
      # support. `go install` works identically on bash and PowerShell runners.
      - name: Install golangci-lint (Go 1.25-compatible)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      # Direct tool invocations (instead of make) keep the pipeline identical
      # on PowerShell, bash, and zsh runners (no chmod/Make dependency).
      - name: Run Linter
        run: golangci-lint run ./... --timeout=5m

      - name: Run Tests
        run: go test ./... -count=1
      
      - name: Run Fuzzing Smoke Test
        run: make fuzz-ci
        
      - name: Build Binary
        run: go build -o dist/helix ./cmd/helix
  
  # Run the end-to-end TTY harness (Linux/macOS; the build tag skips Windows)
  e2e:
    name: E2E TTY Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download Dependencies
        run: go mod download

      - name: Run E2E Harness
        run: make e2e