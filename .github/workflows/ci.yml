# .github/workflows/ci.yml
# Purpose: Continuous Integration pipeline for Helix.
# Enforces linting, testing, and cross-platform builds on every PR and push.
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS report its own result instead of cancelling siblings.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download Dependencies
        run: go mod download

      # ROOT-CAUSE FIX: golangci-lint v1.59.1 predates Go 1.25 and cannot read
      # its type information, which produced bogus
      # "undefined: beep / isatty / runewidth (typecheck)" errors even with all
      # modules downloaded. The v2 release line is the first with full Go 1.25+
      # support. `go install` works identically on bash and PowerShell runners.
      # Retried, because this step's failures are not this project's failures.
      # A build of golangci-lint pulls ~200 modules from proxy.golang.org, and a
      # single HTTP/2 stream error there ("INTERNAL_ERROR; received from peer")
      # fails the whole job before a line of Helix is compiled. Retrying a
      # DOWNLOAD is not the same as retrying a red test: nothing about the
      # repository changes between attempts, so a pass on the second try is
      # evidence about the network rather than about the code.
      - name: Install golangci-lint (Go 1.25-compatible)
        run: |
          for attempt in 1 2 3; do
            if go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0; then
              exit 0
            fi
            echo "::warning::golangci-lint install failed (attempt $attempt/3) — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::golangci-lint could not be installed after 3 attempts"
          exit 1

      # Direct tool invocations (instead of make) keep the pipeline identical
      # on PowerShell, bash, and zsh runners (no chmod/Make dependency).
      - name: Run Linter
        run: golangci-lint run ./... --timeout=5m

      - name: Run Tests
        run: go test ./... -count=1
      
      - name: Run Fuzzing Smoke Test
        run: make fuzz-ci
        
      - name: Build Binary (CGO-free)
        run: go build -o dist/helix ./cmd/helix
        env:
          CGO_ENABLED: '0'
  
  # Run the e2e harness on all three OSes. The PTY/`!windows` tests skip
  # gracefully on Windows (build tag); the daemon-remote IPC test exercises
  # the loopback-TCP transport there. Direct `go test` avoids a Make
  # dependency on PowerShell runners.
  e2e:
    name: E2E Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download Dependencies
        run: go mod download

      - name: Run E2E Harness
        run: go test ./tests/e2e/... -count=1 -timeout 300s