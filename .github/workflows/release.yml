# .github/workflows/release.yml
# Purpose: Continuous Deployment pipeline for Helix releases.
# Triggers on version tags and uses GoReleaser v2 to build and publish assets.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Dependencies
        run: go mod download

      # FIX: Upgraded to goreleaser-action@v6 and explicitly pinned to v2.
      # This resolves the "version: 2 not supported" error and the Node 20
      # deprecation warning for this step.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}