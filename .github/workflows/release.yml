# .github/workflows/release.yml
# Purpose: Continuous Deployment pipeline for Helix releases.
# Triggers on version tags and uses GoReleaser v2 to build and publish assets.
name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  # Required for Sigstore keyless signing via GitHub Actions OIDC
  id-token: write 

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Phase 9: Install Syft for SBOM generation
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      # Phase 9: Install Cosign for artifact signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Download Dependencies
        run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}